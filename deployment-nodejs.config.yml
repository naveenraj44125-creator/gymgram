aws:
  region: us-east-1

lightsail:
  instance_name: gymgram-prod
  static_ip: 
  bundle_id: small_3_0
  blueprint_id: ubuntu_22_04
  bucket:
    enabled: true
    name: gymgram-media-bucket
    access_level: read_write
    bundle_id: medium_1_0

application:
  name: gymgram
  version: 1.0.0
  type: nodejs
  package_files:
    - package.json
    - package-lock.json
    - server/**
    - client/**
    - public/**
    - src/**
    - test-setup.js
  package_fallback: true
  environment_variables:
    APP_ENV: production
    NODE_ENV: production
    PORT: 5000
    MONGODB_URI: mongodb://localhost:27017/gymgram
    JWT_SECRET: CHANGE_ME_jwt_secret_key_here
    AWS_REGION: us-east-1
    AWS_S3_BUCKET: gymgram-media-bucket
    CLIENT_URL: https://INSTANCE_PUBLIC_IP

dependencies:
  git:
    enabled: true
    config:
      install_lfs: false
  firewall:
    enabled: true
    config:
      allowed_ports:
        - 22
        - 80
        - 443
        - 5000
      deny_all_other: true
  mongodb:
    enabled: true
    external: false
    config:
      version: 6.0
      root_password: CHANGE_ME_mongo_root_password_123
      create_database: gymgram
      create_user: gymgram_user
      user_password: CHANGE_ME_mongo_user_password_123
  nodejs:
    enabled: true
    config:
      version: 18
      package_manager: npm
  pm2:
    enabled: true
    config:
      app_name: gymgram-server
      instances: 1
      exec_mode: cluster
      cwd: "/opt/bitnami/projects/gymgram/server"
      script: "server.js"
  nginx:
    enabled: true
    config:
      serve_static: true
      static_directory: "/opt/bitnami/projects/gymgram/client/build"
      proxy_port: 5000
      proxy_path: "/api"

deployment:
  timeouts:
    ssh_connection: 120
    command_execution: 900
    health_check: 300
  retries:
    max_attempts: 3
    ssh_connection: 5
  steps:
    pre_deployment:
      common:
        enabled: true
        update_packages: true
        create_directories: true
        backup_enabled: true
      dependencies:
        enabled: true
        install_system_deps: true
        configure_services: true
    custom_commands:
      pre_build:
        - "cd /opt/bitnami/projects/gymgram && npm run install-deps"
      build:
        - "cd /opt/bitnami/projects/gymgram && npm run build"
      post_build:
        - "sudo chown -R bitnami:bitnami /opt/bitnami/projects/gymgram"
        - "sudo chmod -R 755 /opt/bitnami/projects/gymgram"
    post_deployment:
      common:
        enabled: true
        verify_extraction: true
        create_env_file: true
        cleanup_temp_files: true
      dependencies:
        enabled: true
        configure_application: true
        set_permissions: true
        restart_services: true
    verification:
      enabled: true
      health_check: true
      external_connectivity: true
      endpoints_to_test:
        - /
        - /api/health
      port: 80

github_actions:
  triggers:
    push_branches:
      - main
      - master
    pull_request_branches:
      - main
      - master
    workflow_dispatch: true
  jobs:
    test:
      enabled: true
      docker_test: false
      language_specific_tests: true
    deployment:
      deploy_on_push: true
      deploy_on_pr: false
      artifact_retention_days: 1
      create_summary: true

monitoring:
  health_check:
    endpoint: /api/health
    max_attempts: 20
    wait_between_attempts: 30
    initial_wait: 90
    expected_content: "Gymgram API is running"
    port: 80

security:
  file_permissions:
    web_files: 644
    directories: 755
    config_files: 600
  ssl:
    enabled: true
    force_https: true
    certificate_auto_renew: true
  firewall:
    strict_mode: true
    rate_limiting: true

backup:
  enabled: true
  retention_days: 7
  backup_location: /var/backups/gymgram-deployments
  backup_database: true
  backup_uploads: true
