name: Gymgram Full-Stack Deployment

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'package.json'
      - 'deployment-nodejs.config.yml'
      - '.github/workflows/deploy-react.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'package.json'
      - 'deployment-nodejs.config.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required to checkout code

jobs:
  deploy:
    name: Deploy Gymgram Full-Stack
    # Use reusable workflow from source repo - always gets latest fixes
    uses: naveenraj44125-creator/lamp-stack-lightsail/.github/workflows/deploy-generic-reusable.yml@main
    with:
      config_file: 'deployment-nodejs.config.yml'
      aws_region: 'us-east-1'
    secrets: inherit
  
  summary:
    name: Deployment Summary
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Show Deployment Results
        run: |
          echo "## 🚀 Gymgram Full-Stack Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ needs.deploy.outputs.deployment_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.deploy.outputs.deployment_status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy.outputs.deployment_status }}" = "success" ]; then
            echo "✅ Gymgram deployed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 💪 Gymgram Application" >> $GITHUB_STEP_SUMMARY
            echo "- **Frontend**: ${{ needs.deploy.outputs.deployment_url }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Backend API**: ${{ needs.deploy.outputs.deployment_url }}/api/health" >> $GITHUB_STEP_SUMMARY
            echo "- **Stack**: Node.js + React + MongoDB" >> $GITHUB_STEP_SUMMARY
            echo "- **Features**: User Auth, Media Upload, Social Features" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          fi
